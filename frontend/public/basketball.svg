<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Basketball circle -->
  <circle cx="50" cy="50" r="48" fill="#FF6B35" stroke="#000" stroke-width="2"/>
  
  <!-- Basketball lines -->
  <!-- Vertical center line -->
  <path d="M 50 2 Q 50 50 50 98" fill="none" stroke="#000" stroke-width="2"/>
  
  <!-- Horizontal center line -->
  <path d="M 2 50 Q 50 50 98 50" fill="none" stroke="#000" stroke-width="2"/>
  
  <!-- Left curve -->
  <path d="M 20 2 Q 15 50 20 98" fill="none" stroke="#000" stroke-width="2"/>
  
  <!-- Right curve -->
  <path d="M 80 2 Q 85 50 80 98" fill="none" stroke="#000" stroke-width="2"/>
  
  <!-- Top curve -->
  <path d="M 2 20 Q 50 15 98 20" fill="none" stroke="#000" stroke-width="2"/>
  
  <!-- Bottom curve -->
  <path d="M 2 80 Q 50 85 98 80" fill="none" stroke="#000" stroke-width="2"/>
</svg>
